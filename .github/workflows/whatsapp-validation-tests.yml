name: WhatsApp validation tests

on:
  workflow_dispatch:
  push:
    branches:
      - work/ag-system-whatsapp-image-prototype
      - work/ag-system-maintenance-invoice-ready-whatsapp
  pull_request:
    paths:
      - "supabase/functions/**"

concurrency:
  group: ag-system-whatsapp-validation-tests.yml-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check WhatsApp Edge Functions
        run: deno check supabase/functions/send-sale-invoice-image/index.ts supabase/functions/notify-maintenance-ready/index.ts supabase/functions/whatsapp-meta-webhook/index.ts
      - name: Run WhatsApp validation tests
        run: deno test --allow-read supabase/functions/send-sale-invoice-image/validation_test.ts supabase/functions/notify-maintenance-ready/validation_test.ts supabase/functions/whatsapp-meta-webhook/validation_test.ts
